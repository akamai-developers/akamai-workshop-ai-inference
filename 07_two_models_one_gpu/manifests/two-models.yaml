# Two small models on one GPU.
#
# vLLM runs one model per process, so two models means two vLLM Deployments.
# To put both on a SINGLE physical GPU, the card must be shared. The workshop
# platform enables NVIDIA time-slicing (or MPS) so more than one pod can land on
# the same GPU. Each server is capped at --gpu-memory-utilization 0.45 so the two
# KV caches plus both sets of weights fit within one card's memory.
#
# Pick small models (1.5B to 3B) for the split so both fit. Set the model ids
# with FAST_MODEL and SMART_MODEL. Nothing here is cluster-specific: no IPs, no
# secrets. The two Services are `vllm-fast` and `vllm-smart` on port 8000.
#
# Note: if your platform does NOT share GPUs, these two Deployments will each ask
# for a whole GPU and the second stays Pending. In that case run them on two
# cards, or use time-slicing. The lab notebook explains the contention you see
# when they truly share one card.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-fast
  labels: { app: vllm-fast }
spec:
  replicas: 1
  # Recreate: each pod holds a GPU slice; a rolling update would deadlock waiting
  # for the new pod to schedule before freeing the old.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: vllm-fast }
  template:
    metadata:
      labels: { app: vllm-fast }
    spec:
      # A Service named `vllm` in this namespace would otherwise inject
      # VLLM_PORT=tcp://... which vLLM misreads as its port and crashes.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "$(FAST_MODEL)"
            - "--port"
            - "8000"
            # Half the card each, so two models share one GPU.
            - "--gpu-memory-utilization"
            - "0.45"
            - "--max-model-len"
            - "4096"
          env:
            - name: FAST_MODEL
              value: "Qwen/Qwen2.5-1.5B-Instruct"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-fast
  labels: { app: vllm-fast }
spec:
  selector: { app: vllm-fast }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-smart
  labels: { app: vllm-smart }
spec:
  replicas: 1
  # Recreate: each pod holds a GPU slice; a rolling update would deadlock waiting
  # for the new pod to schedule before freeing the old.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: vllm-smart }
  template:
    metadata:
      labels: { app: vllm-smart }
    spec:
      # A Service named `vllm` in this namespace would otherwise inject
      # VLLM_PORT=tcp://... which vLLM misreads as its port and crashes.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "$(SMART_MODEL)"
            - "--port"
            - "8000"
            - "--gpu-memory-utilization"
            - "0.45"
            - "--max-model-len"
            - "4096"
          env:
            - name: SMART_MODEL
              value: "Qwen/Qwen2.5-3B-Instruct"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-smart
  labels: { app: vllm-smart }
spec:
  selector: { app: vllm-smart }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
