# Canonical vLLM deployment for Modules 5-8.
#
# Starting state for Module 5:
#   MODEL_NAME = Qwen/Qwen3-4B
#
# In Module 5, manually edit this same file to:
#   MODEL_NAME = RedHatAI/Qwen3-4B-FP8-dynamic
#
# Do not reset it after Module 5. The FP8 deployment becomes the forward
# baseline for speculative decoding, saturation, and final vLLM tuning.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  # Recreate avoids a GPU deadlock during updates: the old pod releases the GPU
  # before the replacement pod is scheduled.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Prevent Kubernetes service-link variables such as VLLM_PORT from being
      # injected into the container. vLLM may misread those as its own settings.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.20.2
          args:
            - "--model"
            - "$(MODEL_NAME)"
            - "--port"
            - "8000"
            # Qwen3 tool and reasoning parsers. The measurement helpers disable
            # Qwen3 thinking per request so benchmark tokens are answer tokens.
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "hermes"
            - "--reasoning-parser"
            - "qwen3"
            # Baseline tuning flags. Leave these in place during Module 5; later
            # modules tune scheduler and cache behavior on top of the FP8 model.
            - "--gpu-memory-utilization"
            - "0.50"
            - "--max-model-len"
            - "2048"
            - "--max-num-seqs"
            - "16"
            - "--max-num-batched-tokens"
            - "2048"
            # Module 6 adds speculative decoding here:
            # - "--speculative-config"
            # - '{"method":"draft_model","model":"RedHatAI/Qwen3-0.6B-FP8-dynamic","num_speculative_tokens":4,"draft_tensor_parallel_size":1}'
          env:
            # Module 5 changes this value to RedHatAI/Qwen3-4B-FP8-dynamic.
            - name: MODEL_NAME
              value: "Qwen/Qwen3-4B"
            - name: HF_HUB_DISABLE_XET
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
