# Canonical per-student vLLM deployment for Modules 5-8.
#
# This mirrors the platform-created dedicated vLLM shape: model-cache PVC,
# /models download directory, /dev/shm, GPU node selection, startup probe,
# and the same engine flags used by the rehearsal deployment.
#
# Starting state for Module 5:
#   --model=Qwen/Qwen3-4B
#
# In Module 5, manually edit this same file to:
#   --model=RedHatAI/Qwen3-4B-FP8-dynamic
#
# Do not reset it after Module 5. The FP8 deployment becomes the forward
# baseline for speculative decoding, saturation, and final vLLM tuning.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-cache
  labels:
    app: vllm
spec:
  # Akamai-specific. On another cluster, set this to a storage class your
  # cluster offers: `kubectl get storageclass`.
  storageClassName: linode-block-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  # Recreate avoids a GPU deadlock during updates: the old pod releases the GPU
  # before the replacement pod is scheduled.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      automountServiceAccountToken: false
      # Prevent Kubernetes service-link variables such as VLLM_PORT from being
      # injected into the container. vLLM may misread those as its own settings.
      enableServiceLinks: false
      # Akamai-specific: matches the label the infra/ terraform puts on the
      # GPU pool. On another cluster, label your GPU node to match
      # (`kubectl label node <node> pool=gpu`) or change these two lines to a
      # label your nodes already carry.
      nodeSelector:
        pool: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: predownload-models
          image: vllm/vllm-openai:v0.20.2
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              echo "Pre-downloading into $DL_DIR: $PREDOWNLOAD_MODELS"
              for m in $(echo "$PREDOWNLOAD_MODELS" | tr ',' ' '); do
                [ -z "$m" ] && continue
                echo ">> $m"
                M="$m" python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['M'], cache_dir=os.environ['DL_DIR'])"
              done
              echo "pre-download complete"
          env:
            - name: PREDOWNLOAD_MODELS
              value: "Qwen/Qwen3-4B,RedHatAI/Qwen3-4B-FP8-dynamic,RedHatAI/Qwen3-0.6B-FP8-dynamic"
            - name: DL_DIR
              value: /models
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HUGGING_FACE_HUB_TOKEN
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.20.2
          args:
            - "--model=Qwen/Qwen3-4B"
            - "--download-dir=/models"
            - "--tensor-parallel-size=1"
            - "--gpu-memory-utilization=0.7"
            - "--max-model-len=8192"
            - "--max-num-seqs=32"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--reasoning-parser=qwen3"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
            # Module 6 adds speculative decoding here:
            # - "--speculative-config={\"method\":\"draft_model\",\"model\":\"RedHatAI/Qwen3-0.6B-FP8-dynamic\",\"num_speculative_tokens\":4,\"draft_tensor_parallel_size\":1}"
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HUGGING_FACE_HUB_TOKEN
                  optional: true
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
