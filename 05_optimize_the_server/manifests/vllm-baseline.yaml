# Baseline vLLM deployment for the workshop.
#
# This manifest is DELIBERATELY UNDER-TUNED. It runs, it serves, and it leaves
# obvious headroom on the table so you have something real to optimize in
# section 05. The four flags you will change are marked TUNE THIS below.
#
# It reads the model id from the MODEL_NAME env var so the same manifest works
# for any small model. Nothing here is specific to one cluster: no node names,
# no IPs, no secrets. The Service is named `vllm` on port 8000, which is the
# default the notebooks expect for VLLM_HOST=http://vllm:8000/v1.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the pod holds the whole GPU, so a
  # rolling update would deadlock (the new pod cannot get the card until the old
  # one frees it, and a rolling update will not free the old until the new is
  # ready). Recreate terminates the old pod first, then starts the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # Don't inject Kubernetes service-link env vars. The Service is named
      # `vllm`, so Kubernetes would set VLLM_PORT=tcp://<ip>:8000, which vLLM
      # misreads as its own port and refuses to start. See vLLM env-vars docs.
      enableServiceLinks: false
      containers:
        - name: vllm
          # Pin to the version your platform serves so the engine args and the
          # /metrics names you learned against do not drift. Match this to your
          # serving vLLM (the hosted workshop runs v0.20.2).
          image: vllm/vllm-openai:v0.20.2
          args:
            - "--model"
            - "$(MODEL_NAME)"
            - "--port"
            - "8000"
            # Tool calling plus reasoning, so this same server can back the agent in
            # lab 09. `hermes` is the tool-call parser for Qwen models; the reasoning
            # parser splits the model's <think> block out of the answer and the
            # tool-call JSON. The measurement labs send enable_thinking=false to keep
            # benchmarks clean (common/config.py); the agent leaves thinking on so it
            # reasons before it picks a tool (09_.../agent/agent.py).
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "hermes"
            - "--reasoning-parser"
            - "deepseek_r1"
            # ---- TUNE THIS in section 05 ----
            # Fraction of GPU memory vLLM may use. Low on purpose, so the KV cache
            # is tiny and concurrency is capped early. Raising this is usually the
            # biggest single win. Floor for a 4B model on a 20GB card: 0.40 fails to
            # start (no room for cache blocks), so 0.50 is the under-tuned baseline.
            - "--gpu-memory-utilization"
            - "0.50"
            # Max context length the engine reserves cache for. Short on purpose.
            # Larger values allow longer prompts and outputs but cost KV memory.
            - "--max-model-len"
            - "2048"
            # Max requests in the running batch at once. Low on purpose, so the
            # batch fills and requests queue earlier than they need to.
            - "--max-num-seqs"
            - "16"
            # Max tokens the scheduler will batch per step (prefill + decode).
            # Low on purpose; raising it lets bigger prefills run together.
            - "--max-num-batched-tokens"
            - "2048"
            # ---- end TUNE THIS ----
          env:
            # The model THIS pod serves. It must match MODEL_NAME in your notebook
            # environment (settings.model_name), or the notebook will ask for a model
            # this server does not serve and get a 404. The workshop runs the hybrid
            # Qwen/Qwen3-4B (it can reason for the agent); for Path B set your own.
            - name: MODEL_NAME
              value: "Qwen/Qwen3-4B"
            # Use the plain Hugging Face downloader. The newer xet downloader has
            # been seen stalling at 0 B/s on some clusters, which looks like a pod
            # stuck pulling weights with no error. Harmless if xet is not in play.
            - name: HF_HUB_DISABLE_XET
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
